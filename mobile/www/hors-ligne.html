<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artopif — hors ligne</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #ffffff; color: #14213d; padding: 24px; text-align: center;
  }
  main { max-width: 340px; }
  img { width: 140px; height: auto; }
  h1 { font-size: 1.35rem; margin: 16px 0 8px; }
  p { margin: 0 0 24px; line-height: 1.5; color: #4a5568; }
  button {
    appearance: none; border: 0; border-radius: 999px; padding: 14px 28px;
    background: #14213d; color: #fff; font-size: 1rem; font-weight: 600;
  }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="Artopif">
  <h1>Pas de connexion</h1>
  <p>Artopif a besoin d'Internet pour afficher les artisans et les boutiques. Vérifiez votre connexion puis réessayez.</p>
  <button type="button" onclick="history.length > 1 ? history.back() : location.reload()">Réessayer</button>
</main>
</body>
</html>
